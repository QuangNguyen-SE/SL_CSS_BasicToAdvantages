<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover-overplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Fade in text</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-1">
            <p>Mr.Jojo</p>
        </div>
    </div>
<hr>
    <p> Fade in box</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-2">
            <p>Mr.Jojo</p>
        </div>
    </div>
<hr>
    <p>Slide in top</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-3">
            <p>Mr.Jojo</p>
        </div>
    </div>
<hr>
    <p>Slide in bottom</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-4">
            <p>Mr.Jojo</p>
        </div>
    </div>
<hr>
    <p>Slide in Left</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-5">
            <p>Mr.Jojo</p>
        </div>
    </div>
<hr>
    <p>Slide in right</p>
    <div class="container">
        <img src="img_avatar.png" alt="">
        <div class="overplay num-6">
            <p>Mr.Jojo</p>
        </div>
    </div>
</body>
</html>
